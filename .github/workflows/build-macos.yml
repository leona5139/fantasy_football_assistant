name: Build macOS app

# Apple Silicon only: GitHub retired the free macos-13 (Intel) hosted runner
# in December 2025. Genuine x86_64 builds now require the paid "large"
# runner tier (macos-15-large / macos-latest-large) -- skipped here by
# explicit choice. Apple hasn't sold a new Intel Mac since 2021, so this
# covers any Mac from roughly the last five years; see packaging/HANDOFF.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast tests (fail fast before spending a macOS runner's minutes on a build)
        run: python -m pytest -m "not slow"

      - name: Build with PyInstaller
        run: pyinstaller packaging/app.spec

      - name: Smoke test the packaged binary
        run: |
          FANTASY_DRAFT_SMOKE_TEST=1 ./dist/FantasyDraftAssistant.app/Contents/MacOS/FantasyDraftAssistant &
          PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8765/health; then
              echo "Health check passed"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 15s"
          kill $PID 2>/dev/null || true
          exit 1

      - name: Zip the app bundle
        run: |
          cd dist
          zip -r "FantasyDraftAssistant-macos-arm64.zip" FantasyDraftAssistant.app

      - uses: actions/upload-artifact@v4
        with:
          name: FantasyDraftAssistant-macos-arm64
          path: dist/FantasyDraftAssistant-macos-arm64.zip
