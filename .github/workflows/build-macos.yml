name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: intel
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast tests (fail fast before spending a macOS runner's minutes on a build)
        run: python -m pytest -m "not slow"

      - name: Build with PyInstaller
        run: pyinstaller packaging/app.spec

      - name: Smoke test the packaged binary
        run: |
          FANTASY_DRAFT_SMOKE_TEST=1 ./dist/FantasyDraftAssistant.app/Contents/MacOS/FantasyDraftAssistant &
          PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8765/health; then
              echo "Health check passed"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 15s"
          kill $PID 2>/dev/null || true
          exit 1

      - name: Zip the app bundle
        run: |
          cd dist
          zip -r "FantasyDraftAssistant-${{ matrix.os }}-${{ matrix.arch }}.zip" FantasyDraftAssistant.app

      - uses: actions/upload-artifact@v4
        with:
          name: FantasyDraftAssistant-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/FantasyDraftAssistant-${{ matrix.os }}-${{ matrix.arch }}.zip
